plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.4.21'
}

android {
    namespace 'game.truthordare'
    compileSdk 36
    defaultConfig {
        applicationId 'game.truthordare'
        minSdk 24
        targetSdk 36
        versionCode 81
        versionName '0.5.4'
    }
    signingConfigs {
        release {
            storeFile file('../../outputs/Truth-or-Dare-upload-key.jks')
            storePassword System.getenv('TORD_STORE_PASSWORD')
            keyAlias 'truthordareupload'
            keyPassword System.getenv('TORD_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
}





